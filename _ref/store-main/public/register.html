<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Register | OmniStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: 'Outfit'; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; width: 350px; border: 1px solid #334155; }
        input { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 0.5rem; }
        button { width: 100%; padding: 0.75rem; background: #6366f1; border: none; border-radius: 0.5rem; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Vendor Registration</h2>
        <form id="regForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="text" id="storeName" placeholder="Store Name" required>
            <button type="submit">Register</button>
        </form>
        <p style="margin-top: 1rem; font-size: 0.8rem; color: #94a3b8;">Already have an account? <a href="/login" style="color: #6366f1;">Login</a></p>
    </div>
    <script>
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name.value, email: email.value, password: password.value, storeName: storeName.value })
            });
            const data = await res.json();
            if (data.token) {
                localStorage.setItem('omnistore_token', data.token);
                window.location.href = '/dashboard';
            } else alert(data.error);
        };
    </script>
</body>
</html>
