<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStore | AI-Powered Commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #ec4899; --bg: #0f172a; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: hidden; }
        .hero { max-width: 800px; padding: 2rem; }
        h1 { font-size: 4rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
        p { font-size: 1.25rem; color: #94a3b8; margin-bottom: 2rem; }
        .btn-group { display: flex; gap: 1rem; justify-content: center; }
        .btn { padding: 1rem 2rem; border-radius: 0.5rem; border: none; font-weight: 700; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid #334155; color: white; }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="hero">
        <h1>OmniStore</h1>
        <p>The world's first AI-native digital commerce platform for small vendors. Build your store in seconds with persistent AI shopper assistance.</p>
        <div class="btn-group">
            <a href="/register" class="btn btn-primary">Start Selling</a>
            <a href="/login" class="btn btn-outline">Vendor Login</a>
        </div>
    </div>
</body>
</html>
