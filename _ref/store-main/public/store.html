<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront | OmniStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0a0a1a;
            --card-bg: #16162a;
            --text: #ffffff;
            --text-muted: #a0a0c0;
            --accent: #FF6584;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 0.8rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

        /* Store Header */
        header {
            padding: 4rem 2rem;
            text-align: center;
            background: radial-gradient(circle at top, #1e1e3f, var(--bg));
            position: relative;
        }

        #storeName { font-size: 3.5rem; margin-bottom: 1rem; }
        #storeTagline { color: var(--text-muted); font-size: 1.2rem; }

        /* Cart Floating Button */
        #cartFloat {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--primary);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        #cartBadge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: white;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* Container & Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .product-card:hover { transform: translateY(-10px); border-color: var(--primary); }

        .product-img { width: 100%; height: 250px; object-fit: cover; }
        .product-info { padding: 1.5rem; }
        .product-name { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
        .product-price { color: var(--accent); font-size: 1.5rem; font-weight: 700; }

        /* Modals */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 2rem;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Product Detail UI */
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }
        .detail-img { width: 100%; border-radius: 1.5rem; border: 1px solid var(--border); }
        
        .review-section { margin-top: 3rem; border-top: 1px solid var(--border); padding-top: 2rem; }
        .review-item { padding: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .rating-stars { color: #f59e0b; font-size: 1.2rem; margin-bottom: 0.5rem; }

        /* Form Styles */
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        input, textarea, select {
            width: 100%;
            padding: 1rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 0.8rem;
            color: white;
            outline: none;
        }

        /* Cart & Checkout UI */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(255,255,255,0.03);
            border-radius: 1rem;
            margin-bottom: 1rem;
        }

        /* AI Chat Widget */
        #chatWidget {
            position: fixed; bottom: 2rem; right: 2rem;
            width: 380px; height: 500px;
            background: var(--card-bg);
            border-radius: 1.5rem;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            overflow: hidden; z-index: 1000;
        }
        .chat-header { padding: 1.25rem; background: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 0.75rem; }
        #chatMessages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
        .message { max-width: 80%; padding: 0.75rem 1rem; border-radius: 1rem; font-size: 0.9rem; }
        .user-msg { background: var(--primary); align-self: flex-end; }
        .bot-msg { background: rgba(255,255,255,0.1); align-self: flex-start; }

        @media (max-width: 768px) {
            .product-detail-grid { grid-template-columns: 1fr; }
            #chatWidget { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="storeName">Loading Store...</h1>
        <p id="storeTagline"></p>
    </header>

    <div id="cartFloat" onclick="openCart()">
        🛒 <span id="cartBadge">0</span>
    </div>

    <div class="container">
        <div class="product-grid" id="productGrid">
            <!-- Products injected here -->
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('productModal')">✕</span>
            <div id="productDetail">
                <!-- Content injected here -->
            </div>
            
            <div class="review-section">
                <h3>Customer Reviews</h3>
                <div id="avgRating" style="font-size: 2rem; font-weight: 700; margin: 1rem 0;"></div>
                <div id="reviewsList"></div>
                
                <div class="card" style="margin-top: 2rem; background: rgba(255,255,255,0.02); padding: 2rem; border-radius: 1.5rem;">
                    <h4>Write a Review</h4>
                    <form id="reviewForm" onsubmit="submitReview(event)">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                            <div class="form-group">
                                <label>Your Name</label>
                                <input type="text" id="revName" required>
                            </div>
                            <div class="form-group">
                                <label>Rating</label>
                                <select id="revRating" required>
                                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                                    <option value="3">⭐⭐⭐ (3/5)</option>
                                    <option value="2">⭐⭐ (2/5)</option>
                                    <option value="1">⭐ (1/5)</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Comment</label>
                            <textarea id="revComment" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Review</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close-modal" onclick="closeModal('cartModal')">✕</span>
            <h2>Your Shopping Cart</h2>
            <div id="cartItems" style="margin-top: 2rem;"></div>
            
            <div id="cartSummary" style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                    <span>Subtotal</span>
                    <span id="cartSubtotal">₹0.00</span>
                </div>
                
                <div class="form-group" style="display: flex; gap: 0.5rem;">
                    <input type="text" id="promoInput" placeholder="Promo Code (e.g. SAVE20)">
                    <button class="btn btn-outline" onclick="applyPromo()">Apply</button>
                </div>
                <div id="promoFeedback" style="font-size: 0.8rem; margin-bottom: 1rem;"></div>

                <div style="display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: 700; color: var(--accent);">
                    <span>Total</span>
                    <span id="cartTotal">₹0.00</span>
                </div>
                
                <button class="btn btn-primary" style="width: 100%; margin-top: 2rem;" onclick="openCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-modal" onclick="closeModal('checkoutModal')">✕</span>
            <h2>Order Checkout</h2>
            <form id="checkoutForm" onsubmit="submitCheckout(event)" style="margin-top: 2rem;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="chkName" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="chkEmail" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="chkPhone" required>
                </div>
                <div class="form-group">
                    <label>Shipping Address</label>
                    <textarea id="chkAddress" rows="3" required></textarea>
                </div>
                
                <div style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
                    <h3 style="font-size: 1rem; margin-bottom: 1rem;">Order Summary</h3>
                    <div id="chkSummary"></div>
                </div>

                <button type="submit" id="finalPayBtn" class="btn btn-primary" style="width: 100%;">Pay and Place Order</button>
            </form>
        </div>
    </div>

    <!-- AI Chat Companion -->
    <div id="chatWidget">
        <div class="chat-header">
            <div style="width: 10px; height: 10px; border-radius: 50%; background: #10b981;"></div>
            Store Assistant
        </div>
        <div id="chatMessages">
            <div class="message bot-msg">Hi! I'm your AI shopping assistant. Ask me anything about our products!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask a question...">
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const storeSlug = window.location.pathname.split('/').pop();
        let cart = JSON.parse(localStorage.getItem(`cart_${storeSlug}`) || '[]');
        let activeProduct = null;
        let appliedPromo = null;

        // --- CORE INITIALIZATION ---
        async function loadStore() {
            try {
                const res = await fetch(`/api/store/${storeSlug}`);
                const vendor = await res.json();
                document.getElementById('storeName').textContent = vendor.store_name;
                document.getElementById('storeTagline').textContent = vendor.tagline;
                document.title = `${vendor.store_name} | OmniStore`;

                const pRes = await fetch(`/api/store/${storeSlug}/products`);
                const { products } = await pRes.json();
                renderProducts(products);
                updateCartUI();
            } catch (err) { console.error('Store load error:', err); }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card" onclick="showProductDetails(${p.id})">
                    <img src="${p.image_url || 'https://via.placeholder.com/600x400?text=Product'}" class="product-img">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">₹${p.price}</div>
                    </div>
                </div>
            `).join('');
        }

        // --- PRODUCT DETAILS & REVIEWS ---
        async function showProductDetails(id) {
            const modal = document.getElementById('productModal');
            const content = document.getElementById('productDetail');
            modal.style.display = 'flex';
            content.innerHTML = 'Loading...';

            try {
                const res = await fetch(`/api/store/${storeSlug}/products/${id}`);
                const product = await res.json();
                activeProduct = product;

                content.innerHTML = `
                    <div class="product-detail-grid">
                        <img src="${product.image_url}" class="detail-img">
                        <div>
                            <h2 style="font-size: 2.5rem; margin-bottom: 1rem;">${product.name}</h2>
                            <div class="product-price" style="font-size: 2rem; margin-bottom: 1.5rem;">₹${product.price}</div>
                            <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem;">${product.description}</p>
                            
                            <div style="margin-bottom: 2rem;">
                                <h4>Specifications</h4>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem;">
                                    ${Object.entries(product.specs || {}).map(([k, v]) => `
                                        <div style="font-size: 0.9rem;"><span style="color: var(--text-muted)">${k}:</span> ${v}</div>
                                    `).join('')}
                                </div>
                            </div>

                            <button class="btn btn-primary" style="width: 100%;" onclick="addToCart()">Add to Cart</button>
                        </div>
                    </div>
                `;

                // Render Reviews
                document.getElementById('avgRating').innerHTML = `⭐ ${product.average_rating} <span style="font-size: 1rem; color: var(--text-muted);">(${product.reviews.length} reviews)</span>`;
                document.getElementById('reviewsList').innerHTML = product.reviews.map(r => `
                    <div class="review-item">
                        <div class="rating-stars">${'⭐'.repeat(r.rating)}</div>
                        <div style="font-weight: 600; margin-bottom: 0.2rem;">${r.customer_name}</div>
                        <p style="font-size: 0.9rem; color: var(--text-muted);">${r.comment}</p>
                    </div>
                `).join('') || '<p style="color: var(--text-muted);">No reviews yet. Be the first!</p>';

            } catch (err) { content.innerHTML = 'Error loading product.'; }
        }

        async function submitReview(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('revName').value,
                rating: parseInt(document.getElementById('revRating').value),
                comment: document.getElementById('revComment').value
            };

            try {
                const res = await fetch(`/api/store/${storeSlug}/products/${activeProduct.id}/reviews`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    alert('Review submitted!');
                    showProductDetails(activeProduct.id);
                    document.getElementById('reviewForm').reset();
                }
            } catch (err) { alert('Failed to submit review'); }
        }

        // --- CART SYSTEM ---
        function addToCart() {
            const existing = cart.find(i => i.id === activeProduct.id);
            if (existing) existing.qty++;
            else cart.push({ id: activeProduct.id, name: activeProduct.name, price: activeProduct.price, qty: 1 });
            
            saveCart();
            updateCartUI();
            alert('Added to cart!');
        }

        function saveCart() {
            localStorage.setItem(`cart_${storeSlug}`, JSON.stringify(cart));
        }

        function updateCartUI() {
            const count = cart.reduce((acc, i) => acc + i.qty, 0);
            document.getElementById('cartBadge').textContent = count;
            
            const itemsDiv = document.getElementById('cartItems');
            itemsDiv.innerHTML = cart.map((item, idx) => `
                <div class="cart-item">
                    <div>
                        <div style="font-weight: 600;">${item.name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">₹${item.price} x ${item.qty}</div>
                    </div>
                    <button class="btn" style="padding: 0.5rem; color: var(--accent);" onclick="removeFromCart(${idx})">🗑️</button>
                </div>
            `).join('') || '<p style="text-align: center; color: var(--text-muted);">Your cart is empty.</p>';

            let subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            let discount = 0;
            
            if (appliedPromo) {
                if (appliedPromo.discount_type === 'percentage') discount = (subtotal * appliedPromo.discount_value) / 100;
                else discount = Math.min(subtotal, appliedPromo.discount_value);
            }

            document.getElementById('cartSubtotal').textContent = `₹${subtotal.toFixed(2)}`;
            document.getElementById('cartTotal').textContent = `₹${(subtotal - discount).toFixed(2)}`;
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            saveCart();
            updateCartUI();
        }

        async function applyPromo() {
            const code = document.getElementById('promoInput').value.trim();
            const feedback = document.getElementById('promoFeedback');
            if (!code) return;

            try {
                const res = await fetch(`/api/store/${storeSlug}/checkout/apply-promo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await res.json();
                if (res.ok) {
                    appliedPromo = data;
                    feedback.style.color = '#10b981';
                    feedback.textContent = `Applied: ${data.discount_type === 'percentage' ? data.discount_value + '%' : '₹' + data.discount_value} off!`;
                    updateCartUI();
                } else {
                    feedback.style.color = '#ef4444';
                    feedback.textContent = data.error;
                }
            } catch (err) { feedback.textContent = 'Error applying promo.'; }
        }

        // --- CHECKOUT & ORDER ---
        function openCart() { document.getElementById('cartModal').style.display = 'flex'; }
        function openCheckout() {
            if (cart.length === 0) return alert('Cart is empty!');
            document.getElementById('cartModal').style.display = 'none';
            document.getElementById('checkoutModal').style.display = 'flex';
            
            const summary = document.getElementById('chkSummary');
            summary.innerHTML = cart.map(i => `<div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.5rem;"><span>${i.name} (x${i.qty})</span><span>₹${(i.price * i.qty).toFixed(2)}</span></div>`).join('');
            summary.innerHTML += `<div style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 0.5rem; display: flex; justify-content: space-between; font-weight: 700; color: var(--accent);"><span>Total</span><span>${document.getElementById('cartTotal').textContent}</span></div>`;
        }

        async function submitCheckout(e) {
            e.preventDefault();
            const btn = document.getElementById('finalPayBtn');
            btn.disabled = true;
            btn.textContent = 'Processing Transaction...';

            const data = {
                customerName: document.getElementById('chkName').value,
                customerEmail: document.getElementById('chkEmail').value,
                customerPhone: document.getElementById('chkPhone').value,
                shippingAddress: document.getElementById('chkAddress').value,
                items: cart,
                promoCode: appliedPromo ? appliedPromo.code : null
            };

            try {
                const res = await fetch(`/api/store/${storeSlug}/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    localStorage.removeItem(`cart_${storeSlug}`);
                    alert(`Order successful! Order ID: ${result.orderId}`);
                    window.location.reload();
                } else {
                    alert(result.error);
                }
            } catch (err) { alert('Checkout failed: ' + err.message); }
            finally {
                btn.disabled = false;
                btn.textContent = 'Pay and Place Order';
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- CHATBOT ---
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const container = document.getElementById('chatMessages');
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.textContent = message;
            container.appendChild(userDiv);
            input.value = '';

            try {
                const res = await fetch(`/api/store/${storeSlug}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, sessionId: 'store-session' })
                });
                const data = await res.json();
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-msg';
                botDiv.textContent = data.reply;
                container.appendChild(botDiv);
                botDiv.scrollIntoView();
            } catch (err) { console.error(err); }
        }

        loadStore();
    </script>
</body>
</html>
